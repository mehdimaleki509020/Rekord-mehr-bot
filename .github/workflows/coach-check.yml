name: Coach pilot checks
on:
  pull_request:
    paths:
      - 'worker_aban.js'
      - 'coach_hooshi.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/coach-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Live Preview and Hooshi smoke (signed OIDC, fictional seller)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository
        run: python tests/preview_live_probe.py
